<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Shravan Vaishya</title>
  <meta name="description" content="Contact form for reaching Shravan Vaishya.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="container header-inner">
    <a class="brand" href="index.html" aria-label="Shravan Vaishya home">SV</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a><a href="about.html">About</a><a href="projects.html">Projects</a><a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="container section narrow" aria-labelledby="contact-title">
    <p class="eyebrow">Get in touch</p>
    <h1 id="contact-title">Contact Me</h1>
    <p class="lead">Use the accessible form below to send a message.</p>

    <form class="contact-form" action="#" method="post">
      <div class="form-group">
        <label for="name">Full name <span aria-hidden="true">*</span></label>
        <input type="text" id="name" name="name" autocomplete="name" required aria-required="true">
      </div>

      <div class="form-group">
        <label for="email">Email address <span aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" autocomplete="email" required aria-required="true">
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject">
      </div>

      <div class="form-group">
        <label for="message">Message <span aria-hidden="true">*</span></label>
        <textarea id="message" name="message" rows="7" required aria-required="true"></textarea>
      </div>

      <button type="submit">Send message</button>
      <p class="help" id="form-help">Fields marked with an asterisk are required.</p>
    </form>
  </section>
</main>

<footer><div class="container"><p>&copy; 2026 Shravan Vaishya.</p></div></footer>
</body>
</html>
